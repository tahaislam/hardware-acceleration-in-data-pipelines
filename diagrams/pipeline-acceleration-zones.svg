<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Pipeline Acceleration Zones</text>
  <text x="450" y="50" text-anchor="middle" font-size="11" fill="#777">Where hardware acceleration fits (and doesn't) in a canonical data pipeline</text>

  <!-- Pipeline stages -->
  <!-- Ingestion -->
  <rect x="30" y="90" width="150" height="70" rx="6" fill="#FADBD8" stroke="#E74C3C" stroke-width="1.5"/>
  <text x="105" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#922B21">Ingestion</text>
  <text x="105" y="135" text-anchor="middle" font-size="9" fill="#922B21">Parsing, validation</text>
  <text x="105" y="148" text-anchor="middle" font-size="9" fill="#922B21">Schema enforcement</text>

  <!-- Arrow -->
  <line x1="185" y1="125" x2="220" y2="125" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Transformation -->
  <rect x="225" y="90" width="150" height="70" rx="6" fill="#D5F5E3" stroke="#27AE60" stroke-width="1.5"/>
  <text x="300" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E8449">Transformation</text>
  <text x="300" y="135" text-anchor="middle" font-size="9" fill="#1E8449">Compute kernels</text>
  <text x="300" y="148" text-anchor="middle" font-size="9" fill="#1E8449">Aggregation, joins</text>

  <!-- Arrow -->
  <line x1="380" y1="125" x2="415" y2="125" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Serialization -->
  <rect x="420" y="90" width="150" height="70" rx="6" fill="#FEF9E7" stroke="#F39C12" stroke-width="1.5"/>
  <text x="495" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#B7950B">Serialization</text>
  <text x="495" y="135" text-anchor="middle" font-size="9" fill="#B7950B">Format encoding</text>
  <text x="495" y="148" text-anchor="middle" font-size="9" fill="#B7950B">Compression</text>

  <!-- Arrow -->
  <line x1="575" y1="125" x2="610" y2="125" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Output / Sink -->
  <rect x="615" y="90" width="150" height="70" rx="6" fill="#FADBD8" stroke="#E74C3C" stroke-width="1.5"/>
  <text x="690" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#922B21">Output / Sink</text>
  <text x="690" y="135" text-anchor="middle" font-size="9" fill="#922B21">I/O bound</text>
  <text x="690" y="148" text-anchor="middle" font-size="9" fill="#922B21">Network, storage</text>

  <!-- Orchestration bar spanning full width -->
  <rect x="30" y="185" width="735" height="35" rx="4" fill="#F2F3F4" stroke="#AAB7B8" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="397" y="207" text-anchor="middle" font-size="11" fill="#717D7E">Orchestration &amp; Scheduling (not a compute problem — never accelerate this)</text>

  <!-- Suitability labels -->
  <text x="450" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Acceleration Suitability by Stage</text>

  <!-- Legend boxes -->
  <rect x="60" y="280" width="160" height="55" rx="4" fill="#FADBD8" stroke="#E74C3C" stroke-width="1"/>
  <text x="140" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#922B21">Low</text>
  <text x="140" y="315" text-anchor="middle" font-size="9" fill="#922B21">Control-flow heavy</text>
  <text x="140" y="328" text-anchor="middle" font-size="9" fill="#922B21">I/O dominant, irregular input</text>

  <rect x="260" y="280" width="160" height="55" rx="4" fill="#D5F5E3" stroke="#27AE60" stroke-width="1"/>
  <text x="340" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E8449">Highest</text>
  <text x="340" y="315" text-anchor="middle" font-size="9" fill="#1E8449">Compute-bound, regular</text>
  <text x="340" y="328" text-anchor="middle" font-size="9" fill="#1E8449">Well-defined contracts</text>

  <rect x="460" y="280" width="160" height="55" rx="4" fill="#FEF9E7" stroke="#F39C12" stroke-width="1"/>
  <text x="540" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#B7950B">Moderate</text>
  <text x="540" y="315" text-anchor="middle" font-size="9" fill="#B7950B">Depends on format</text>
  <text x="540" y="328" text-anchor="middle" font-size="9" fill="#B7950B">regularity and volume</text>

  <rect x="660" y="280" width="160" height="55" rx="4" fill="#F2F3F4" stroke="#AAB7B8" stroke-width="1"/>
  <text x="740" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#717D7E">None</text>
  <text x="740" y="315" text-anchor="middle" font-size="9" fill="#717D7E">Orchestration, scheduling</text>
  <text x="740" y="328" text-anchor="middle" font-size="9" fill="#717D7E">Not compute-bound</text>

  <!-- Key insight -->
  <text x="450" y="370" text-anchor="middle" font-size="10" fill="#555" font-style="italic">"The stages with the highest acceleration potential also have the most well-defined input/output contracts."</text>

  <!-- Note -->
  <text x="450" y="400" text-anchor="middle" font-size="9" fill="#999">This diagram deliberately shows the pipeline, not the accelerator. Acceleration suitability is a property of the stage, not the hardware.</text>
</svg>
