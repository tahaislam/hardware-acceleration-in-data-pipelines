<svg viewBox="0 0 800 750" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Acceleration Decision Tree</text>
  <text x="400" y="46" text-anchor="middle" font-size="10" fill="#777">Apply criteria in order — the first "No" should end the evaluation</text>

  <!-- Node 1: Compute-bound? -->
  <rect x="200" y="65" width="320" height="40" rx="5" fill="#EBF5FB" stroke="#2E86AB" stroke-width="1.5"/>
  <text x="360" y="90" text-anchor="middle" font-size="11" fill="#1A5276">Is the bottleneck measured and confirmed as compute-bound?</text>
  <!-- Yes arrow down -->
  <line x1="360" y1="105" x2="360" y2="135" stroke="#27AE60" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="345" y="125" font-size="9" fill="#27AE60" font-weight="bold">Yes</text>
  <!-- No arrow right -->
  <line x1="520" y1="85" x2="590" y2="85" stroke="#E74C3C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="545" y="80" font-size="9" fill="#E74C3C" font-weight="bold">No</text>
  <rect x="595" y="70" width="160" height="30" rx="4" fill="#FADBD8" stroke="#E74C3C" stroke-width="1"/>
  <text x="675" y="90" text-anchor="middle" font-size="10" fill="#922B21">STOP: Profile first</text>

  <!-- Node 2: Algorithmic optimizations? -->
  <rect x="200" y="140" width="320" height="40" rx="5" fill="#EBF5FB" stroke="#2E86AB" stroke-width="1.5"/>
  <text x="360" y="165" text-anchor="middle" font-size="11" fill="#1A5276">Have algorithmic optimizations been attempted?</text>
  <line x1="360" y1="180" x2="360" y2="210" stroke="#27AE60" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="345" y="200" font-size="9" fill="#27AE60" font-weight="bold">Yes</text>
  <line x1="520" y1="160" x2="590" y2="160" stroke="#E74C3C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="545" y="155" font-size="9" fill="#E74C3C" font-weight="bold">No</text>
  <rect x="595" y="145" width="160" height="30" rx="4" fill="#FADBD8" stroke="#E74C3C" stroke-width="1"/>
  <text x="675" y="165" text-anchor="middle" font-size="10" fill="#922B21">STOP: Optimize first</text>

  <!-- Node 3: High compute density? -->
  <rect x="200" y="215" width="320" height="40" rx="5" fill="#EBF5FB" stroke="#2E86AB" stroke-width="1.5"/>
  <text x="360" y="240" text-anchor="middle" font-size="11" fill="#1A5276">Is the workload high compute density? (parallel, regular)</text>
  <line x1="360" y1="255" x2="360" y2="285" stroke="#27AE60" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="345" y="275" font-size="9" fill="#27AE60" font-weight="bold">Yes</text>
  <line x1="520" y1="235" x2="590" y2="235" stroke="#E74C3C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="545" y="230" font-size="9" fill="#E74C3C" font-weight="bold">No</text>
  <rect x="595" y="220" width="160" height="30" rx="4" fill="#FADBD8" stroke="#E74C3C" stroke-width="1"/>
  <text x="675" y="240" text-anchor="middle" font-size="10" fill="#922B21">STOP: Poor accel. fit</text>

  <!-- Node 4: Transfer overhead? -->
  <rect x="200" y="290" width="320" height="40" rx="5" fill="#EBF5FB" stroke="#2E86AB" stroke-width="1.5"/>
  <text x="360" y="315" text-anchor="middle" font-size="11" fill="#1A5276">Is data transfer overhead &lt; 30% of compute time?</text>
  <line x1="360" y1="330" x2="360" y2="360" stroke="#27AE60" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="345" y="350" font-size="9" fill="#27AE60" font-weight="bold">Yes</text>
  <line x1="520" y1="310" x2="590" y2="310" stroke="#E74C3C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="545" y="305" font-size="9" fill="#E74C3C" font-weight="bold">No</text>
  <rect x="595" y="295" width="170" height="30" rx="4" fill="#FEF9E7" stroke="#F39C12" stroke-width="1"/>
  <text x="680" y="315" text-anchor="middle" font-size="10" fill="#B7950B">Investigate batching</text>

  <!-- Node 5: CPU fallback? -->
  <rect x="200" y="365" width="320" height="40" rx="5" fill="#EBF5FB" stroke="#2E86AB" stroke-width="1.5"/>
  <text x="360" y="390" text-anchor="middle" font-size="11" fill="#1A5276">Can you build a CPU fallback and test both in CI?</text>
  <line x1="360" y1="405" x2="360" y2="435" stroke="#27AE60" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="345" y="425" font-size="9" fill="#27AE60" font-weight="bold">Yes</text>
  <line x1="520" y1="385" x2="590" y2="385" stroke="#E74C3C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="545" y="380" font-size="9" fill="#E74C3C" font-weight="bold">No</text>
  <rect x="595" y="370" width="170" height="30" rx="4" fill="#FADBD8" stroke="#E74C3C" stroke-width="1"/>
  <text x="680" y="390" text-anchor="middle" font-size="10" fill="#922B21">STOP: Operational risk</text>

  <!-- Node 6: Team readiness? -->
  <rect x="200" y="440" width="320" height="40" rx="5" fill="#EBF5FB" stroke="#2E86AB" stroke-width="1.5"/>
  <text x="360" y="465" text-anchor="middle" font-size="11" fill="#1A5276">Can 2+ engineers maintain the accelerated path?</text>
  <line x1="360" y1="480" x2="360" y2="510" stroke="#27AE60" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="345" y="500" font-size="9" fill="#27AE60" font-weight="bold">Yes</text>
  <line x1="520" y1="460" x2="590" y2="460" stroke="#E74C3C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="545" y="455" font-size="9" fill="#E74C3C" font-weight="bold">No</text>
  <rect x="595" y="445" width="170" height="30" rx="4" fill="#FADBD8" stroke="#E74C3C" stroke-width="1"/>
  <text x="680" y="465" text-anchor="middle" font-size="10" fill="#922B21">STOP: Org. risk</text>

  <!-- Node 7: ROI? -->
  <rect x="200" y="515" width="320" height="40" rx="5" fill="#EBF5FB" stroke="#2E86AB" stroke-width="1.5"/>
  <text x="360" y="540" text-anchor="middle" font-size="11" fill="#1A5276">Does ROI justify integration cost?</text>
  <line x1="360" y1="555" x2="360" y2="585" stroke="#27AE60" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="345" y="575" font-size="9" fill="#27AE60" font-weight="bold">Yes</text>
  <line x1="520" y1="535" x2="590" y2="535" stroke="#E74C3C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="545" y="530" font-size="9" fill="#E74C3C" font-weight="bold">No</text>
  <rect x="595" y="520" width="170" height="30" rx="4" fill="#FADBD8" stroke="#E74C3C" stroke-width="1"/>
  <text x="680" y="540" text-anchor="middle" font-size="10" fill="#922B21">STOP: Revisit later</text>

  <!-- Proceed -->
  <rect x="220" y="590" width="280" height="55" rx="6" fill="#D5F5E3" stroke="#27AE60" stroke-width="2"/>
  <text x="360" y="613" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E8449">PROCEED WITH ACCELERATION</text>
  <text x="360" y="632" text-anchor="middle" font-size="10" fill="#1E8449">Start with the least-specialized option</text>

  <!-- Spectrum reminder -->
  <rect x="130" y="670" width="540" height="35" rx="4" fill="#F8F9FA" stroke="#CCC" stroke-width="1"/>
  <text x="400" y="690" text-anchor="middle" font-size="10" fill="#555">SIMD → GPU → FPGA → ASIC (move right only when the previous step is insufficient)</text>

  <!-- Footer -->
  <text x="400" y="735" text-anchor="middle" font-size="9" fill="#999">See docs/acceleration-decision-framework.md for detailed discussion of each criterion</text>
</svg>
